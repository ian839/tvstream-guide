name: Build & Publish Multi-Country TV Guide

on:
  schedule:
    # Runs automatically every day at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-guide:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate Multi-Country TV Guides
        run: |
          python3 scripts/generate_all_guides.py .

      - name: Commit and push updated guides
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.json
          if git diff --staged --quiet; then
            echo "No guide changes detected."
          else
            git commit -m "Automated update of multi-country TV guides ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
