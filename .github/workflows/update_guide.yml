name: Update UK TV Guide

on:
  schedule:
    # Run once daily at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build-guide:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate compact guide JSON
        run: |
          python scripts/generate_uk_guide.py uk_guide.json

      - name: Commit and push updated guide
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add uk_guide.json
          # The EPG add-on publishes events/*.json and hub_guide/*.json to this
          # branch every few minutes via the Contents API, so main may have
          # moved since checkout: rebase before pushing instead of failing.
          if git diff --staged --quiet; then
            echo "No guide changes to commit"
            exit 0
          fi
          git commit -m "Automated daily UK guide update [skip ci]"
          # Retry: the add-on may push between our rebase and our push.
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Push attempt $attempt failed; retrying"
            sleep $((attempt * 3))
          done
          echo "Giving up after 5 attempts" >&2
          exit 1
